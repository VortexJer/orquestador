<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa embed — Google Maps</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #f5f4f0; padding: 3rem 2rem; }

  /* ============================================================
     MAPA GOOGLE MAPS — REGLA ABSOLUTA
     Nunca dibujes un mapa custom ni uses canvas/SVG para mapas.
     SIEMPRE usa un iframe embed de Google Maps.

     URL del embed (sustituye LAT y LNG por las coordenadas reales):
     https://www.google.com/maps?q=LAT,LNG&output=embed&z=16

     También puedes usar la dirección:
     https://maps.google.com/maps?q=Carrer+de+Ramon+y+Cajal+35+Xirivella+Valencia&output=embed&z=16
  ============================================================ */

  /* Sección de localización típica */
  .seccion-mapa {
    max-width: 1100px; margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: start;
  }

  /* Info de contacto */
  .mapa-info h2 { font-size: 2rem; margin-bottom: 2rem; }
  .mapa-dato {
    display: flex; gap: 1rem; align-items: flex-start;
    margin-bottom: 1.5rem;
  }
  .mapa-dato .icono { font-size: 1.3rem; flex-shrink: 0; margin-top: .1rem; }
  .mapa-dato p { line-height: 1.5; }
  .mapa-dato strong { display: block; margin-bottom: .2rem; }

  /* Contenedor del mapa: aspect-ratio fijo + width 100% */
  .mapa-contenedor {
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    aspect-ratio: 4/3; /* el iframe llenará este contenedor */
  }

  .mapa-contenedor iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Responsive */
  @media (max-width: 700px) {
    .seccion-mapa { grid-template-columns: 1fr; }
    .mapa-contenedor { aspect-ratio: 16/9; }
  }
</style>
</head>
<body>

<section class="seccion-mapa">

  <!-- Info de contacto -->
  <div class="mapa-info">
    <h2>¿Cómo llegar?</h2>

    <div class="mapa-dato">
      <span class="icono">📍</span>
      <p><strong>Dirección</strong>Carrer de Ramón y Cajal, 35<br>46950 Xirivella, Valencia</p>
    </div>

    <div class="mapa-dato">
      <span class="icono">📞</span>
      <p><strong>Teléfono</strong><a href="tel:961011350">961 011 350</a></p>
    </div>

    <div class="mapa-dato">
      <span class="icono">🕐</span>
      <p><strong>Horario</strong>Lunes a domingo<br>Cierra a las 0:00</p>
    </div>
  </div>

  <!-- MAPA: siempre iframe de Google Maps -->
  <div class="mapa-contenedor">
    <!--
      Sustituye LAT y LNG con las coordenadas del negocio.
      Para Bar Roma: lat=39.4670391 lon=-0.4301168
      z=16 es el zoom (15-17 es ideal para un local)
    -->
    <iframe
      src="https://www.google.com/maps?q=39.4670391,-0.4301168&output=embed&z=16"
      title="Ubicación en Google Maps"
      allowfullscreen
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>

</section>

============================================================ -->

</body>
</html>
