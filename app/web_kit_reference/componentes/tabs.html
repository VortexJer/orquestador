<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabs / pestañas</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f8fafc; color: #0f172a;
         max-width: 600px; margin: 0 auto; padding: 4rem 1.5rem; }
  .tablist { display: flex; gap: .3rem; border-bottom: 2px solid #e2e8f0; }
  .tab { background: none; border: none; padding: .9rem 1.3rem; font-size: 1rem; cursor: pointer;
    color: #64748b; position: relative; font: inherit; }
  .tab[aria-selected="true"] { color: #2563eb; font-weight: 600; }
  /* línea inferior animada bajo la pestaña activa */
  .tab[aria-selected="true"]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -2px;
    height: 2px; background: #2563eb; }
  .panel { padding: 1.8rem 0; line-height: 1.6; color: #334155; }
  .panel[hidden] { display: none; }
</style>
</head>
<body>
  <div class="tablist" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  aria-controls="p1" id="t1">Descripción</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p2" id="t2">Detalles</button>
    <button class="tab" role="tab" aria-selected="false" aria-controls="p3" id="t3">Opiniones</button>
  </div>

  <div class="panel" role="tabpanel" id="p1" aria-labelledby="t1"><p>Contenido de la primera pestaña. Cambia haciendo clic en las de arriba, o con las flechas del teclado cuando una pestaña tiene el foco.</p></div>
  <div class="panel" role="tabpanel" id="p2" aria-labelledby="t2" hidden><p>Aquí irían los detalles técnicos, especificaciones, etc.</p></div>
  <div class="panel" role="tabpanel" id="p3" aria-labelledby="t3" hidden><p>Y aquí las opiniones o reseñas de clientes.</p></div>

<script>
  const tabs = [...document.querySelectorAll('.tab')];
  const paneles = [...document.querySelectorAll('.panel')];

  function activar(indice) {
    tabs.forEach((t, i) => {
      const activo = i === indice;
      t.setAttribute('aria-selected', String(activo));
      paneles[i].hidden = !activo;
    });
    tabs[indice].focus();
  }

  tabs.forEach((tab, i) => {
    tab.addEventListener('click', () => activar(i));
    // navegación con flechas izquierda/derecha (accesibilidad)
    tab.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') activar((i + 1) % tabs.length);
      if (e.key === 'ArrowLeft') activar((i - 1 + tabs.length) % tabs.length);
    });
  });
</script>
</body>
</html>
