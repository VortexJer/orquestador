<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constelación de nodos con conexiones — red de conceptos en 3D (15.16)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; color: #fff; overflow: hidden; }

  /* ================================================================
     CONSTELACIÓN DE NODOS — un pequeño número de conceptos (servicios,
     valores, pasos de un proceso, integraciones) representados como
     esferas etiquetadas flotando en 3D y conectadas entre si. Es la
     alternativa 3D a un diagrama plano de "nuestros servicios" o
     "como funciona" - util para negocios tech/consultoria/software
     con un numero MANEJABLE de conceptos (5-8, no mas: con mas nodos
     se vuelve ilegible, usa globo-wireframe-red.html en su lugar si
     lo que necesitas es transmitir escala/cantidad, no conceptos
     concretos con nombre).

     Las etiquetas son Sprites con una textura de Canvas 2D (texto) -
     un Sprite en Three.js SIEMPRE mira a la cámara automaticamente
     (billboard), asi que el texto nunca se ve de canto ni al reves,
     sin necesitar CSS2DRenderer (un addon aparte).

     AUTOALOJAR: mismo proceso que hero-objeto-flotante.html.
  ================================================================ */

  .seccion-constelacion {
    position: relative; height: 100%;
    background: radial-gradient(circle at 50% 50%, #141826, #06070c);
    display: grid; place-items: center; text-align: center;
  }
  #constelacion-3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .contenido { position: relative; z-index: 1; padding: 2rem; pointer-events: none; }
  .contenido h1 { font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 800; text-shadow: 0 4px 30px rgba(0,0,0,.7); }
</style>
</head>
<body>
  <section class="seccion-constelacion">
    <canvas id="constelacion-3d"></canvas>
    <div class="contenido"><h1>Como trabajamos</h1></div>
  </section>

  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    // ← EN PRODUCCIÓN: los conceptos reales del proyecto (servicios, valores, pasos...)
    const NODOS = [
      { texto: 'Estrategia', color: '#8b6cff' },
      { texto: 'Diseño', color: '#22d3a8' },
      { texto: 'Desarrollo', color: '#ff8a5b' },
      { texto: 'Lanzamiento', color: '#5b8aff' },
      { texto: 'Soporte', color: '#d15ba8' },
    ];
    // Pares conectados por indice - no todos con todos, solo las relaciones que importan
    const CONEXIONES = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 4], [1, 3]];

    function crearEtiqueta(THREE, texto, color) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(16, 32, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '600 26px system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(texto, 36, 34);
      const textura = new THREE.CanvasTexture(c);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: textura, transparent: true }));
      sprite.scale.set(1.8, 0.45, 1);
      return sprite;
    }

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.getElementById('constelacion-3d');
    if (reduce) {
      canvas.style.display = 'none';
    } else {
      const THREE = await import('three');

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 0, 8);

      let renderer = null;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      } catch (e) {
        canvas.style.display = 'none';
      }

      if (renderer) {
        renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
        renderer.setSize(innerWidth, innerHeight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        const grupo = new THREE.Group();
        const posiciones = NODOS.map((_, i) => {
          const angulo = (i / NODOS.length) * Math.PI * 2;
          const radio = 2.6;
          return new THREE.Vector3(
            Math.cos(angulo) * radio,
            Math.sin(i * 2.1) * 0.9,
            Math.sin(angulo) * radio * 0.6
          );
        });

        NODOS.forEach((n, i) => {
          const esfera = new THREE.Mesh(
            new THREE.SphereGeometry(0.22, 24, 24),
            new THREE.MeshStandardMaterial({ color: n.color, emissive: n.color, emissiveIntensity: 0.4, roughness: 0.4 })
          );
          esfera.position.copy(posiciones[i]);
          grupo.add(esfera);

          const etiqueta = crearEtiqueta(THREE, n.texto, n.color);
          etiqueta.position.copy(posiciones[i]).add(new THREE.Vector3(0, 0.5, 0));
          grupo.add(etiqueta);
        });

        CONEXIONES.forEach(([a, b]) => {
          const geometriaLinea = new THREE.BufferGeometry().setFromPoints([posiciones[a], posiciones[b]]);
          const linea = new THREE.Line(
            geometriaLinea,
            new THREE.LineBasicMaterial({ color: 0x4a5578, transparent: true, opacity: 0.6 })
          );
          grupo.add(linea);
        });

        scene.add(grupo);

        let targetX = 0;
        addEventListener('pointermove', (e) => { targetX = (e.clientX / innerWidth - 0.5) * 2; });
        addEventListener('resize', () => {
          camera.aspect = innerWidth / innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(innerWidth, innerHeight);
        });

        const reloj = new THREE.Clock();
        (function animar() {
          requestAnimationFrame(animar);
          const t = reloj.getElapsedTime();
          grupo.rotation.y = t * 0.06 + targetX * 0.15; // giro lento + leve respuesta al puntero
          renderer.render(scene, camera);
        })();
      }
    }
  </script>
</body>
</html>
