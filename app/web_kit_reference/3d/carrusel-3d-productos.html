<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrusel 3D de productos fotorrealistas — la vitrina que se gira arrastrando (15.21)</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: system-ui, sans-serif; color: #fff; overflow: hidden; }

  /* ================================================================
     CARRUSEL 3D FOTORREALISTA — la versión con profundidad REAL del
     carrusel de tarjetas (../componentes/carrusel.html): los
     productos del negocio (aquí la vitrina de una pastelería-café)
     en un círculo, el activo delante grande y nítido, el resto
     detrás difuminado por la niebla. Arrastra (con inercia + imán
     al más cercano) o usa flechas/puntos.

     CUÁNDO ESTE Y NO EL 2D: cuando lo que se enseña son PRODUCTOS
     físicos y hay presupuesto de "wow" (carta, línea de producto,
     packs). Para fotos o testimonios, el 2D — más barato.

     Detalles que lo hacen creíble (no los recortes al adaptar):
     - Niebla del MISMO color que el fondo CSS: difumina lo lejano
       gratis, como profundidad de campo.
     - Sombra de contacto bajo cada producto (luzClave+sueloSombra).
     - La ficha (nombre/precio) se actualiza al ENCAJAR, no durante
       el arrastre.
     - Flechas + puntos: accesible con teclado, no solo drag.

     Lo ÚNICO a adaptar: la lista PRODUCTOS (slug del catálogo de
     cargador-3d.js + nombre + precio). SERVIDOR LOCAL para verlo
     (Live Server) — ver cargador-3d.js.
  ================================================================ */

  .seccion {
    position: relative; height: 100%;
    background: radial-gradient(circle at 50% 38%, #26201b, #14100d 75%);
    display: grid; grid-template-rows: auto 1fr auto; text-align: center;
  }
  .seccion header { padding-top: 2.6rem; }
  .seccion header h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); font-weight: 900; letter-spacing: -.02em; }
  .seccion header p { color: #b3a494; margin-top: .4rem; }

  #escena-3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #escena-3d.arrastrando { cursor: grabbing; }

  .ficha { position: relative; z-index: 1; padding-bottom: 2.2rem; pointer-events: none; }
  .ficha h2 { font-size: 1.5rem; font-weight: 800; }
  .ficha p { color: #e8b04b; font-weight: 700; margin-top: .2rem; }

  .controles { position: relative; z-index: 1; display: flex; gap: .6rem; justify-content: center;
    align-items: center; padding-bottom: 2rem; }
  .controles button { background: #262019; color: #fff; border: 1px solid #423728;
    width: 44px; height: 44px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; }
  .controles button:hover { background: #332a20; }
  .puntos { display: flex; gap: .45rem; margin: 0 .6rem; }
  .puntos span { width: 8px; height: 8px; border-radius: 50%; background: #423728; transition: background .25s; }
  .puntos span.activo { background: #e8b04b; }
</style>
</head>
<body>
  <section class="seccion">
    <header>
      <h1>La vitrina de hoy</h1>
      <p>Arrastra para girarla</p>
    </header>
    <canvas id="escena-3d"></canvas>
    <div class="ficha">
      <h2 id="ficha-nombre">—</h2>
      <p id="ficha-detalle">—</p>
    </div>
    <div class="controles">
      <button id="anterior" aria-label="Producto anterior">&#8592;</button>
      <div class="puntos" id="puntos"></div>
      <button id="siguiente" aria-label="Producto siguiente">&#8594;</button>
    </div>
  </section>

  <script src="cargador-3d.js"></script>
  <!-- DEMO ONLY: en producción, import map local (ver hero-objeto-flotante.html) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    // ── lo ÚNICO a adaptar: qué modelos (slug del catálogo) y qué textos ──
    const PRODUCTOS = [
      { slug: 'strawberry_chocolate_cake', nombre: 'Chocolate y fresas', detalle: '32 € — por encargo' },
      { slug: 'carrot_cake',               nombre: 'Carrot cake',        detalle: '4,80 € la porción' },
      { slug: 'croissant',                 nombre: 'Croissant artesano', detalle: '2,10 €' },
      { slug: 'tea_set_01',                nombre: 'Merienda para dos',  detalle: '14 € — té + dulce' },
      { slug: 'food_apple_01',             nombre: 'Fruta del día',      detalle: '1,20 €' },
    ];

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const canvas = document.getElementById('escena-3d');
    const THREE = await import('three');
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const { RGBELoader } = await import('three/addons/loaders/RGBELoader.js');
    const kit3d = window.crearCargador3D(THREE, GLTFLoader, RGBELoader);

    let renderer = null;
    try {
      renderer = kit3d.prepararRenderer(new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }));
    } catch (e) { canvas.style.display = 'none'; } // FALLBACK: header + controles siguen

    if (renderer) {
      renderer.setSize(innerWidth, innerHeight);

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x14100d, 6.5, 12.5); // difumina lo de atrás "gratis"

      const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 60);
      camera.position.set(0, 1.35, 8.4);
      camera.lookAt(0, 0.1, 0);

      try {
        await kit3d.aplicarEntorno(renderer, scene, kit3d.ENTORNOS.estudio);
      } catch (e) {
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      }
      kit3d.luzClave(scene, { area: 6 });

      // ── la rueda de productos ──
      const RADIO = 3.0;
      const paso = (Math.PI * 2) / PRODUCTOS.length;
      const rueda = new THREE.Group();
      scene.add(rueda);
      kit3d.sueloSombra(scene, { radio: 9, y: -0.78, opacidad: 0.35 });

      try {
        for (let i = 0; i < PRODUCTOS.length; i++) {
          const entrada = kit3d.catalogo.find((m) => m.slug === PRODUCTOS[i].slug);
          const m = await kit3d.cargar(entrada.ruta, { alto: 1.5 });
          m.position.set(Math.sin(i * paso) * RADIO, -0.02, Math.cos(i * paso) * RADIO);
          rueda.add(m);
        }
      } catch (e) {
        console.warn('Modelos no disponibles (¿abierto sin servidor local?):', e);
      }

      // girando la RUEDA (no la cámara), el activo siempre queda delante
      let angulo = 0, velocidad = 0, indice = 0, arrastrando = false, xPrevio = 0;
      let imanActivo = true;

      const fichaNombre = document.getElementById('ficha-nombre');
      const fichaDetalle = document.getElementById('ficha-detalle');
      const puntos = document.getElementById('puntos');
      PRODUCTOS.forEach(() => puntos.appendChild(document.createElement('span')));

      function actualizarFicha() {
        fichaNombre.textContent = PRODUCTOS[indice].nombre;
        fichaDetalle.textContent = PRODUCTOS[indice].detalle;
        [...puntos.children].forEach((p, i) => p.classList.toggle('activo', i === indice));
      }
      function irA(i) {
        indice = ((i % PRODUCTOS.length) + PRODUCTOS.length) % PRODUCTOS.length;
        imanActivo = true;
        actualizarFicha();
      }
      document.getElementById('siguiente').addEventListener('click', () => irA(indice + 1));
      document.getElementById('anterior').addEventListener('click', () => irA(indice - 1));
      irA(0);

      // ── drag con inercia + imán (patrón de producto-configurador-drag.html) ──
      canvas.addEventListener('pointerdown', (e) => {
        arrastrando = true; imanActivo = false; xPrevio = e.clientX;
        canvas.classList.add('arrastrando');
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!arrastrando) return;
        const delta = (e.clientX - xPrevio) / innerWidth;
        xPrevio = e.clientX;
        angulo += delta * 3.2;
        velocidad = delta * 3.2;
      });
      canvas.addEventListener('pointerup', () => {
        arrastrando = false;
        canvas.classList.remove('arrastrando');
        indice = ((Math.round(-angulo / paso) % PRODUCTOS.length) + PRODUCTOS.length) % PRODUCTOS.length;
        imanActivo = true;
        actualizarFicha();
      });

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      const reloj = new THREE.Clock();
      function frame() {
        const t = reloj.getElapsedTime();
        if (!arrastrando) {
          if (imanActivo) {
            const objetivo = -indice * paso; // por el camino corto
            let dif = (objetivo - angulo) % (Math.PI * 2);
            if (dif > Math.PI) dif -= Math.PI * 2;
            if (dif < -Math.PI) dif += Math.PI * 2;
            angulo += dif * 0.08;
          } else {
            angulo += velocidad; velocidad *= 0.95;
            if (Math.abs(velocidad) < 0.0004) {
              indice = ((Math.round(-angulo / paso) % PRODUCTOS.length) + PRODUCTOS.length) % PRODUCTOS.length;
              imanActivo = true;
              actualizarFicha();
            }
          }
        }
        rueda.rotation.y = angulo;
        // cada producto gira despacio sobre sí mismo — pero compensando
        // el giro de la rueda para no marear
        rueda.children.forEach((m) => { m.rotation.y = reduce ? -angulo : t * 0.25 - angulo; });
        renderer.render(scene, camera);
      }
      // con reduced-motion el bucle sigue (girar la rueda es NAVEGACIÓN,
      // no decoración), pero los productos no rotan sobre sí mismos
      (function animar() { requestAnimationFrame(animar); frame(); })();
    }
  </script>
</body>
</html>
