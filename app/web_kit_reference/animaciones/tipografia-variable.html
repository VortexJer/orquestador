<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Variable fonts: el axis 'wght' va en un solo archivo, se anima fluido -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
<title>Tipografías variables animadas — el peso respira</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #0d0d12; color: #fff; }
  .label { position: fixed; top: 1rem; left: 1rem; z-index: 50; font-size: .7rem;
           color: #666; letter-spacing: .15em; text-transform: uppercase; }
  section { min-height: 80vh; display: grid; place-items: center; padding: 2rem; text-align: center; }

  /* ================================================================
     TIPOGRAFÍAS VARIABLES ANIMADAS.

     Una variable font (Fraunces, Inter, Recoleta...) guarda TODO el
     rango de pesos en un eje continuo. En vez de saltar de 400 a 700,
     el peso puede "respirar" de forma fluida con hover o scroll.

     CLAVE: anima font-variation-settings con transition. Es algo que
     una fuente estática NO puede hacer. Sutil pero se nota mucho en el
     resultado final.

     Dos disparadores en este demo:
       1) hover  → el peso engorda al pasar el ratón
       2) scroll → al entrar en viewport (clase .en-viewport vía JS o,
                   aquí, animation-timeline nativo, 0 JS)
  ================================================================ */

  /* 1 — Peso fluido al hover */
  .titulo-hover {
    font-family: 'Fraunces', serif;
    font-size: clamp(3rem, 12vw, 8rem); line-height: 1; cursor: default;
    font-variation-settings: 'wght' 300, 'opsz' 144;
    transition: font-variation-settings .45s cubic-bezier(.22,1,.36,1);
  }
  .titulo-hover:hover { font-variation-settings: 'wght' 900, 'opsz' 144; }

  /* 2 — Peso ligado al scroll, nativo (sin JS) */
  @media (prefers-reduced-motion: no-preference) {
    .titulo-scroll {
      font-family: 'Inter', sans-serif;
      font-size: clamp(2.5rem, 10vw, 7rem); line-height: 1;
      animation: engordar linear both;
      animation-timeline: view();
      animation-range: entry 10% cover 50%;
    }
    @keyframes engordar {
      from { font-variation-settings: 'wght' 100; letter-spacing: .04em; opacity: .4; }
      to   { font-variation-settings: 'wght' 800; letter-spacing: -.01em; opacity: 1; }
    }
  }
  .titulo-scroll { font-variation-settings: 'wght' 800; } /* fallback sin soporte */

  p.pista { margin-top: 1.2rem; color: #888; font-size: .95rem; }
</style>
</head>
<body>
  <p class="label">Tipografía variable · hover y scroll</p>

  <section>
    <div>
      <div class="titulo-hover">Respira</div>
      <p class="pista">↑ pasa el ratón: el peso engorda fluido (300 → 900)</p>
    </div>
  </section>

  <section>
    <div>
      <div class="titulo-scroll">Más fuerte</div>
      <p class="pista">↑ el peso crece con el scroll (100 → 800), sin JS</p>
    </div>
  </section>
</body>
</html>
