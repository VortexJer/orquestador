<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diseño de sonido sutil — Web Audio API nativa</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #0c0c12; color: #fff;
         min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
  .wrap { text-align: center; }

  /* ================================================================
     DISEÑO DE SONIDO SUTIL — Web Audio API, CERO dependencias.

     Casi ninguna web de pyme usa sonido. Un micro-click suave en los
     CTA importantes refuerza la sensación premium. Se sintetiza en el
     navegador (un oscilador + envolvente de ganancia), no es un .mp3.

     REGLAS INNEGOCIABLES:
       - SOLO tras un gesto del usuario (los navegadores bloquean audio
         sin interacción). Engánchalo a 'click', NUNCA a 'load'.
       - Si suena en más de un elemento, botón de SILENCIAR visible.
         El sonido no pedido es lo primero que molesta.
       - Resérvalo para mood E/F y 1-2 interacciones clave (CTA
         principal), nunca todos los botones de la página.
  ================================================================ */

  .cta {
    appearance: none; border: none; cursor: pointer;
    background: linear-gradient(135deg, #7c5cff, #22d3a8);
    color: #06121a; font-weight: 800; font-size: 1.1rem;
    padding: 1rem 2.4rem; border-radius: 12px;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 16px 40px rgba(124,92,255,.35);
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 22px 50px rgba(124,92,255,.45); }
  .cta:active { transform: translateY(0); }

  .mute {
    margin-top: 1.5rem; background: none; border: 1px solid #333; color: #999;
    font-size: .8rem; padding: .4rem 1rem; border-radius: 20px; cursor: pointer;
  }
  .mute.silenciado { color: #e0526a; border-color: #e0526a; }
  p.pista { margin-top: 1.2rem; color: #666; font-size: .85rem; }
</style>
</head>
<body>
  <div class="wrap">
    <button class="cta" id="cta">Reservar ahora</button>
    <br>
    <button class="mute" id="mute" aria-pressed="false">🔊 Sonido activado</button>
    <p class="pista">Pulsa el botón principal — micro-click sintetizado</p>
  </div>

<script>
  let silenciado = false;
  let ctx = null; // se crea en el primer gesto (requisito del navegador)

  function sonidoClick() {
    if (silenciado) return;
    // AudioContext debe crearse/reanudarse tras interacción del usuario
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();

    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.04, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  }

  document.getElementById('cta').addEventListener('click', sonidoClick);

  const mute = document.getElementById('mute');
  mute.addEventListener('click', () => {
    silenciado = !silenciado;
    mute.classList.toggle('silenciado', silenciado);
    mute.setAttribute('aria-pressed', String(silenciado));
    mute.textContent = silenciado ? '🔇 Sonido silenciado' : '🔊 Sonido activado';
  });
</script>
</body>
</html>
