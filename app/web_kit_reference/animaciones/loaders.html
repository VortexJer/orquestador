<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loaders y estados de carga</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #f4f4f5; color: #27272a;
         display: flex; flex-wrap: wrap; gap: 2.5rem; padding: 3rem; }
  .demo { background: #fff; border-radius: 14px; padding: 2rem; width: 260px;
          box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .demo h3 { font-size: .85rem; color: #71717a; margin: 0 0 1.5rem; font-weight: 600;
             text-transform: uppercase; letter-spacing: .04em; }

  /* 1. Spinner clásico (círculo girando) */
  .spinner { width: 44px; height: 44px; border: 4px solid #e4e4e7;
    border-top-color: #6366f1; border-radius: 50%; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* 2. Tres puntos rebotando */
  .puntos { display: flex; gap: 8px; }
  .puntos span { width: 12px; height: 12px; border-radius: 50%; background: #6366f1;
    animation: rebote 1.4s ease-in-out infinite both; }
  .puntos span:nth-child(2) { animation-delay: .16s; }
  .puntos span:nth-child(3) { animation-delay: .32s; }
  @keyframes rebote { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }

  /* 3. Barra de progreso indeterminada */
  .barra { width: 100%; height: 6px; background: #e4e4e7; border-radius: 3px; overflow: hidden; }
  .barra::before { content: ''; display: block; width: 40%; height: 100%;
    background: #6366f1; border-radius: 3px; animation: avanzar 1.3s ease-in-out infinite; }
  @keyframes avanzar { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

  /* 4. Skeleton (esqueleto de contenido mientras carga) */
  .skeleton-linea, .skeleton-circulo {
    background: linear-gradient(90deg, #e4e4e7 25%, #f4f4f5 50%, #e4e4e7 75%);
    background-size: 200% 100%; animation: brillar 1.5s infinite;
  }
  .skeleton-circulo { width: 48px; height: 48px; border-radius: 50%; margin-bottom: 1rem; }
  .skeleton-linea { height: 12px; border-radius: 6px; margin-bottom: .7rem; }
  .skeleton-linea.corta { width: 60%; }
  @keyframes brillar { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  @media (prefers-reduced-motion: reduce) {
    .spinner, .puntos span, .barra::before, .skeleton-linea, .skeleton-circulo { animation-duration: 3s; }
  }
</style>
</head>
<body>
  <div class="demo"><h3>Spinner</h3><div class="spinner"></div></div>
  <div class="demo"><h3>Puntos</h3><div class="puntos"><span></span><span></span><span></span></div></div>
  <div class="demo"><h3>Barra de progreso</h3><div class="barra"></div></div>
  <div class="demo">
    <h3>Skeleton</h3>
    <div class="skeleton-circulo"></div>
    <div class="skeleton-linea"></div>
    <div class="skeleton-linea"></div>
    <div class="skeleton-linea corta"></div>
  </div>
</body>
</html>
