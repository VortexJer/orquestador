# Catalogo declarativo de especialistas. Agregar uno nuevo = agregar una
# entrada aca + su skill.md + (si hace falta) su tool_runner. El core del
# router y del gateway no se tocan.
#
# base_model_ref: referencia logica de pesos. Varios especialistas pueden
# compartir la misma ref -> el Model Manager no recarga VRAM al pasar de
# uno a otro (ver doc de arquitectura, seccion 6 y 10).
#
# enabled: false = registrado en el catalogo (skill, herramientas, RAG)
# pero todavia no wireado en app/specialists/ del orquestador de
# produccion. El router heuristico igual lo conoce y degrada
# graciosamente al fallback de su familia (ver
# app/router/heuristic_router.py, _DOMAIN_FALLBACK_FAMILY) cuando el
# dominio matchea pero el especialista ideal esta deshabilitado.
#
# Estos especialistas SI son utilizables hoy fuera del orquestador de
# produccion, via la terminal agentica de pruebas (groq_agent/), que
# carga cualquier skill.md directamente sin depender de este flag.

router_model:
  base_model_ref: "router-tiny"
  model_name: "Qwen2.5-1.5B-Instruct"
  context_window: 32768
  quantization: "GGUF Q4_K_M"
  always_warm: true
  # Tambien actua como validador final (decision confirmada: cero costo
  # extra de VRAM, ya esta cargado) y como especialista trivial_text.

embedder:
  model_name: "BAAI/bge-small-en-v1.5"
  runtime: "fastembed"
  dim: 384

specialists:
  python-specialist:
    enabled: true
    domain: python
    base_model_ref: "coder-main"
    model_name: "Qwen2.5-Coder-14B-Instruct"
    quantization: "AWQ 4-bit"
    context_window: 32768
    context_window_extended: 131072
    skill_file: "skills/python-specialist.md"
    tools: ["ruff", "mypy", "pytest"]
    max_iterations: 3
    rag_collections: ["python", "security"]

  # --- Especialistas TRANSVERSALES (no de un lenguaje) -----------------
